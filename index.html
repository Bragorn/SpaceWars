<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceWars</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="game"></canvas>

    <!-- Slim Top Bar HUD -->
    <div id="hud-top-center" class="hud-top-center hidden">
        <div class="hud-team-card t1" id="hud-card-t1">
            <div class="hud-card-header" id="hud-label-t1">T1 FACTION</div>
            <div class="hud-card-body">
                <span>SHIPS: <b id="hud-val-t1" class="hud-ship-val">0</b></span>
                <span>SPM: <b id="hud-spm-t1">0.0</b></span>
            </div>
            <div class="hud-card-body">
                <span>DEAD: <b id="hud-dead-t1" class="hud-ship-val">0</b></span>
                <span>SEND: <b id="hud-send">75%</b></span>
            </div>
        </div>

        <div class="hud-center-cluster">
            <div id="game-timer" class="hud-timer">00:00</div>
            <div class="hud-controls">
                <button id="btn-play-pause" class="hud-btn">Pause</button>
                <button id="btn-speed-1" class="hud-btn active">1X</button>
                <button id="btn-speed-2" class="hud-btn">2X</button>
                <button id="btn-speed-3" class="hud-btn">3X</button>
                <button id="btn-esc-menu" class="hud-btn hud-btn-esc">ESC</button>
            </div>
        </div>

        <div class="hud-team-card t2" id="hud-card-t2">
            <div class="hud-card-header" id="hud-label-t2">T2 FACTION</div>
            <div class="hud-card-body">
                <span>SHIPS: <b id="hud-val-t2" class="hud-ship-val">0</b></span>
                <span>SPM: <b id="hud-spm-t2">0.0</b></span>
            </div>
            <div class="hud-card-body">
                <span>DEAD: <b id="hud-dead-t2" class="hud-ship-val">0</b></span>
            </div>
        </div>

        <div id="dev-panel" class="dev-panel hidden">
            <div class="dev-panel-title">DEV DATA [ ` TO TOGGLE ]</div>
            <div class="dev-panel-cols">
                <div id="dev-t1" class="dev-col"></div>
                <div id="dev-t2" class="dev-col"></div>
            </div>
        </div>
    </div>

    <!-- ESC Exit Confirmation Popup Modal -->
    <div id="exit-confirm-modal" class="hidden">
        <p>Warning game will not be saved. Confirm Exit?</p>
        <div class="exit-modal-actions">
            <button id="btn-exit-yes" class="menu-btn">Yes</button>
            <button id="btn-exit-no" class="menu-btn">No</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden">
        <h1 id="game-over-title">VICTORY</h1>
        <p id="game-over-msg"></p>
        <button id="btn-new-match" class="menu-btn">NEW MATCH</button>  
    </div>

    <div id="ui-overlay">
        <div id="menu-title" class="menu-card">
            <h2>SPACE WARS</h2>
            <button id="btn-title-enter" class="menu-btn">ENTER</button>
        </div>

        <div id="menu-match-setup" class="menu-card menu-setup-card" style="display: none;">
            <div class="setup-header-row">
                <h2 class="menu-title">MATCH SETUP</h2>
                <div class="mode-select-box">
                    <span>MODE:</span>
                    <button id="btn-toggle-gamemode" class="arcade-toggle-btn">PLAYER VS CPU</button>
                </div>
            </div>

            <div class="matchup-container">
                <!-- Left Team Panel: Arcade Faction Cycler -->
                <div class="team-panel team-home">
                    <div id="p1-header-label" class="team-header">PLAYER 1</div>
                    <div class="arcade-selector">
                        <button class="arcade-arrow-btn" id="p1-prev"><</button>
                        <div id="p1-faction-display" class="arcade-faction-name">REMNANTS</div>
                        <button class="arcade-arrow-btn" id="p1-next">></button>
                    </div>
                </div>

                <!-- Center: Arena / Map Selector -->
                <div class="matchup-center">
                    <div class="vs-badge">VS</div>
                    <div class="map-select-box">
                        <h3>SELECT ARENA</h3>
                        <div id="slot-buttons" class="slot-buttons-list"></div>
                    </div>
                </div>

                <!-- Right Team Panel: Arcade Faction Cycler -->
                <div class="team-panel team-away">
                    <div id="p2-header-label" class="team-header">CPU ENEMY</div>
                    <div class="arcade-selector">
                        <button class="arcade-arrow-btn" id="p2-prev"><</button>
                        <div id="p2-faction-display" class="arcade-faction-name">PROTOCOL</div>
                        <button class="arcade-arrow-btn" id="p2-next">></button>
                    </div>
                </div>
            </div>

            <!-- Bottom Action Row -->
            <div class="menu-actions">
                <button id="btn-setup-back" class="menu-btn">BACK</button>
                <button id="btn-setup-launch" class="menu-btn btn-primary">LAUNCH MATCH</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT INCLUDES -->
    <!-- data -->
    <script src="js/data/config.js"></script>
    <script src="js/data/Factions.js"></script>
    <script src="js/data/Effects.js"></script>
    <script src="js/data/Sounds.js"></script>
    <script src="js/data/MapRegistry.js"></script>

    <!-- entities -->
    <script src="js/entities/Planet.js"></script>
    <script src="js/entities/Ship.js"></script>

    <!-- systems -->
    <script src="js/systems/OrbitalMath.js"></script>
    <script src="js/systems/Controls.js"></script>
    <script src="js/systems/AIController.js"></script>

    <!-- render -->
    <script src="js/render/Viewport.js"></script>
    <script src="js/render/Renderer.js"></script>

    <!-- core, utils, ui -->
    <script src="js/core/AudioManager.js"></script>
    <script src="js/utils/TelemetryCollector.js"></script>
    <script src="js/core/GameManager.js"></script>
    <script src="js/ui/HUD.js"></script>

    <!-- start-up (must be last) -->
    <script src="js/main.js"></script>
    <script src="js/ui/App.js"></script>

</body>
</html>
